<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperCoders Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Animated Shapes -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="app-container" id="app">
        <!-- Header / Search Bar Area -->
        <header class="search-header" id="header">
            <h1 class="logo">SuperCoders <span class="highlight">Search</span></h1>
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off">
            </div>
        </header>

        <!-- Loading Indicator -->
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p>Searching index...</p>
        </div>

        <!-- Results Area -->
        <main class="results-container" id="resultsArea">
            <p class="stats" id="searchStats"></p>
            <div class="results-list" id="resultsList">
                <!-- Result cards injected here via JS -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
